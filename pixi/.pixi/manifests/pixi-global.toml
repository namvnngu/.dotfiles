version = 1

[envs.clib]
channels = ["~/.pixi/forges/nam-forge/packages", "conda-forge"]
dependencies = { clib = "*" }
exposed = { clib = "clib", clib-build = "clib-build", clib-configure = "clib-configure", clib-init = "clib-init", clib-install = "clib-install", clib-search = "clib-search", clib-uninstall = "clib-uninstall", clib-update = "clib-update", clib-upgrade = "clib-upgrade" }

[envs.mole]
channels = ["~/.pixi/forges/nam-forge/packages"]
dependencies = { mole = "*" }
exposed = { mo = "mo", mole = "mole" }

[envs.radare2]
channels = ["~/.pixi/forges/nam-forge/packages"]
dependencies = { radare2 = "*" }
exposed = { r2r = "r2r", clang-format-radare2 = "clang-format-radare2", r2 = "r2", r2agent = "r2agent", r2p = "r2p", r2pm = "r2pm", r2sdb = "r2sdb", rabin2 = "rabin2", radare2 = "radare2", radiff2 = "radiff2", rafind2 = "rafind2", rafs2 = "rafs2", ragg2 = "ragg2", rahash2 = "rahash2", rapatch2 = "rapatch2", rarun2 = "rarun2", rasign2 = "rasign2", rasm2 = "rasm2", ravc2 = "ravc2", rax2 = "rax2" }
